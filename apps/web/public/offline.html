<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Sense connexió</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --text: #0a0a0a; --muted: #4d4d4d; --accent: #0a0a0a; --on-accent: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --text: #ffffff; --muted: #b8b8b8; --accent: #ffffff; --on-accent: #000000; } }
  body { font-family: "Hanken Grotesk", system-ui, sans-serif; margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--text); background: var(--bg); }
  main { max-width: 24rem; }
  .mark { font-weight: 800; font-size: 15px; margin: 0 0 24px; }
  h1 { font-size: 1.5rem; font-weight: 800; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }
  button { font: inherit; font-weight: 700; min-height: 44px; padding: 0 20px; border: 0; border-radius: 2px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="mark">Escolta activa</p>
  <h1 data-k="h">Sense connexió</h1>
  <p data-k="p">No hem pogut carregar l'app. Comprova la connexió i torna-ho a provar. Les respostes que ja has enviat estan guardades.</p>
  <button type="button" data-k="b" onclick="location.reload()">Torna-ho a provar</button>
</main>
<script>
  // Static page served from the service worker cache: pick the language from the damm_lang cookie, else the browser.
  var T = {
    ca: { t: "Sense connexió", h: "Sense connexió", p: "No hem pogut carregar l'app. Comprova la connexió i torna-ho a provar. Les respostes que ja has enviat estan guardades.", b: "Torna-ho a provar" },
    es: { t: "Sin conexión", h: "Sin conexión", p: "No hemos podido cargar la app. Comprueba la conexión e inténtalo de nuevo. Las respuestas que ya has enviado están guardadas.", b: "Inténtalo de nuevo" },
    en: { t: "No connection", h: "No connection", p: "We could not load the app. Check your connection and try again. The answers you have already sent are saved.", b: "Try again" }
  };
  var m = document.cookie.match(/(?:^|; )damm_lang=(ca|es|en)/);
  var l = m ? m[1] : (navigator.language || "ca").slice(0, 2).toLowerCase();
  var d = T[l] || T.ca;
  document.documentElement.lang = T[l] ? l : "ca";
  document.title = d.t;
  document.querySelectorAll("[data-k]").forEach(function (e) { e.textContent = d[e.getAttribute("data-k")]; });
</script>
</body>
</html>
